; Kluisjesbeheer Docker — supervisord-config
; Draait gunicorn (app) en cron (dagelijkse leerling-sync) als 2 processen
; in dezelfde container. tini is PID 1 (in CMD), supervisord is PID 2.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

[program:gunicorn]
command=/usr/local/bin/gunicorn
    --bind 0.0.0.0:5000
    --workers 2
    --access-logfile -
    --error-logfile -
    --capture-output
    app:create_app()
directory=/opt/kluisjesbeheer/backend
user=kluisjes
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:cron]
command=/usr/sbin/cron -f
user=root
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
